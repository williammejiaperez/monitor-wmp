name: Monitor Concursos CFE

on:
  workflow_dispatch:
    inputs:
      palabra_clave:
        description: 'Palabra a buscar en la descripción (dejar vacío para todos)'
        required: false
        default: ''
  schedule:
    - cron: '0 */4 * * *'

# Permiso necesario para que el robot pueda guardar el CSV en tu repositorio
permissions:
  contents: write

jobs:
  ejecutar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerías y Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Ejecutar monitor de CFE
        env:
          PALABRA_CLAVE: ${{ github.event.inputs.palabra_clave || 'LINEAS DE TRANSMISION' }}
        run: python monitor_cfe_cloud.py

      - name: Guardar y subir CSV al repositorio
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "GitHub Actions Bot"
          git add concursos_cfe_vigentes.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática concursos CFE" && git push)
